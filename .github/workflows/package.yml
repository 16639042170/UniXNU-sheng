name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9 # Wi-Fi runtime and Data firmware integration
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: 16639042170/sheng-ci-inputs
          ref: main
          token: ${{ secrets.BUILD_INPUTS_TOKEN }}
          path: ci-inputs
          persist-credentials: false
      - name: stage sheng firmware
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          source = Path("ci-inputs/firmware/wcn7850")
          destination = Path("device/firmware/wcn7850")
          expected = {
              "amss.bin": "43aadfd3df887f27de74020273aee484bac6a31dd53068f91baf2a9b094d6a68",
              "m3.bin": "0e72f44df7defc269fe92dcea25d4d409046c04b77d41c510c52879b3dfc1055",
              "board-2.bin": "6a98237c743d864773a547e81e23f0c6dc721dcd7331926bee7381e2152e00fd",
          }

          destination.mkdir(parents=True, exist_ok=True)
          for name, digest in expected.items():
              data = (source / name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != digest:
                  raise SystemExit(f"firmware SHA-256 mismatch: {name}: {actual}")
              (destination / name).write_bytes(data)
              print(f"{name}: {actual}")
          PY
      - name: stage proprietary firmware
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          inputs = {
              "firmware/nanosic/MCU_Upgrade.bin":
                  ("device/.cache/firmware/nanosic/MCU_Upgrade.bin",
                   "9eb7213603474d926d3af1124d3c14d63cbfc58ea2f7f7d9fedc088093fd63c5"),
              "firmware/novatek/novatek_nt36532_n81a_fw_csot.bin":
                  ("device/.cache/firmware/novatek/novatek_nt36532_n81a_fw_csot.bin",
                   "750508bb4d75472d35ce5852ec8470d66afa6bf4a4274c136b3759034260ef59"),
              "firmware/qcom/sm8550/sheng/vpu30_4v.mbn":
                  ("device/.cache/firmware/qcom/sm8550/sheng/vpu30_4v.mbn",
                   "56c41b7b28694d261af67db40fa64a6f7076709171876fcc3abf0ce411506edb"),
          }
          for source_name, (destination_name, expected) in inputs.items():
              data = (Path("ci-inputs") / source_name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"firmware SHA-256 mismatch: {source_name}: {actual}")
              destination = Path(destination_name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              print(f"{source_name}: {actual}")
          PY
      - name: pin the sheng SoC sources required by Bluetooth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("device/feeds.toml")
          text = path.read_text()
          old = 'commit = "a9f45dc60c035084b95463781538380f4c3606c9"'
          new = 'commit = "2dc650ca76ae38715cd0712e60a44b14fe251745"'
          if old in text:
              path.write_text(text.replace(old, new, 1), newline="\n")
          elif new not in text:
              raise SystemExit("unexpected SM8550 source pin")
          PY
      - name: cache Ath12kWifi sources
        uses: actions/cache@v4
        with:
          path: device/drivers/Ath12kWifi/deps
          key: ath12k-sources-${{ hashFiles('device/drivers/Ath12kWifi/tools/source-lock.json') }}
      - name: repair Ath12kWifi sparse checkout paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("device/drivers/Ath12kWifi/tools/fetch-sources.py")
          text = path.read_text()
          old = 'subprocess.run(["git", "-C", str(directory), "sparse-checkout", "add", *source["paths"]], check=True)'
          new = 'subprocess.run(["git", "-C", str(directory), "sparse-checkout", "add", "--skip-checks", *paths], check=True)'
          if old in text:
              path.write_text(text.replace(old, new, 1), newline="\n")
          elif new not in text:
              raise SystemExit("unexpected Ath12kWifi sparse-checkout call")
          PY
      - name: fetch Ath12kWifi sources
        run: device/drivers/Ath12kWifi/tools/fetch-sources.sh
      - name: repair the pinned Mesa diagnostics patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patch = Path("UniXNU/patches/mesa/turnip-frame-diagnostics.patch")
          text = patch.read_text()
          old = "diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\n--- /dev/null\n"
          new = "diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\nnew file mode 100644\n--- /dev/null\n"
          if new not in text:
              if old not in text:
                  raise SystemExit("unexpected diagnostics patch header")
              patch.write_text(text.replace(old, new, 1), newline="\n")
          PY
      - name: backport the reference-kernel cache-input stub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("UniXNU/scripts/build-fileset-release-reference.py")
          text = path.read_text()
          old = "native_[a-z0-9_]+|boot_log_rounds)"
          new = "native_[a-z0-9_]+|boot_log_rounds|boot_cache_input_capture)"
          if old in text:
              path.write_text(text.replace(old, new, 1), newline="\n")
          elif new not in text:
              raise SystemExit("unexpected reference-kernel stub matcher")
          PY
      - name: backport the XnuPrelink bang-root exclusion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("UniXNU/kits/XnuPrelink/fileset_emit.py")
          text = path.read_text()
          marker = "excluded = {root[1:] for root in roots if root.startswith('!')}"
          if marker not in text:
              edits = [
                  (
                      "    closure, pending = set(), list(roots)\n",
                      "    # A root written !bundle.id leaves that dependency out, for a kext that only names it in a metaclass comparison: its\n"
                      "    # OSDynamicCast finds nothing, and rebase_collection takes it off the retained kexts' library lists.\n"
                      "    excluded = {root[1:] for root in roots if root.startswith('!')}\n"
                      "    closure, pending = set(), [root for root in roots if not root.startswith('!')]\n",
                  ),
                  (
                      "        if identifier in closure:\n",
                      "        if identifier in closure or identifier in excluded:\n",
                  ),
                  (
                      "            dropped_personalities.append(entry['CFBundleIdentifier'])\n",
                      "            dropped_personalities.append(entry['CFBundleIdentifier'])\n"
                      "        for root in roots or ():\n"
                      "            if root.startswith('!') and root[1:] in (entry.get('OSBundleLibraries') or {}):\n"
                      "                del entry['OSBundleLibraries'][root[1:]]\n",
                  ),
              ]
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f"unexpected XnuPrelink context: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, newline="\n")
          PY
      - name: report the prelink layout bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("UniXNU/kits/XnuPrelink/fileset_layout.py")
          text = path.read_text()
          old = "            raise ValueError('Native code would collide with collection data')"
          new = ("            raise ValueError(f'Native code would collide with collection data: "
                 "code_end={code_end:#x} data={self.roots[\"__DATA\"][\"va\"]:#x} "
                 "over={code_end - self.roots[\"__DATA\"][\"va\"]:#x}')")
          if old in text:
              path.write_text(text.replace(old, new, 1), newline="\n")
          elif new not in text:
              raise SystemExit("unexpected XnuPrelink layout collision check")
          PY
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: fileset-reference failure diagnostics
        if: failure()
        run: |
          find UniXNU/out/sheng -path '*/build/xnu/fileset-reference/*/*-build.log' -type f -print0 2>/dev/null |
          while IFS= read -r -d '' log; do
            echo "::group::${log} (tail)"
            tail -n 400 "$log" || true
            echo "::endgroup::"
          done
      - name: kernel failure diagnostics
        if: failure()
        run: |
          find UniXNU/out/sheng -path '*/logs/kernel.log' -type f -print0 2>/dev/null |
          while IFS= read -r -d '' log; do
            echo "::group::${log} (tail)"
            tail -n 600 "$log" || true
            echo "::endgroup::"
          done
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
